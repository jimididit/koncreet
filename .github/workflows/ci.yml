name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Unit tests
        run: bash tests/run.sh

      - name: ShellCheck
        run: shellcheck -S error koncreet install.sh lib/*.sh modules/*.sh

  smoke:
    strategy:
      matrix:
        image: ["debian:12", "ubuntu:24.04"]
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Deps
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq bash ca-certificates openssl

      - name: Smoke dry-run
        run: bash tests/smoke-dry-run.sh
