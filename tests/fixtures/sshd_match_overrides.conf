# Global values are not Match overrides
PasswordAuthentication no
PermitRootLogin no

# Address blocks are not covered by the local sshd -T -C probes
Match Address 203.0.113.0/24
    PasswordAuthentication yes

match all
  permitrootlogin=Yes

MATCH User ops
	ChallengeResponseAuthentication yes

Match User safe
    PasswordAuthentication no
    # PasswordAuthentication yes
